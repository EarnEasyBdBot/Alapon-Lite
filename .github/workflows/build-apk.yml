name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Bubblewrap (PWA to APK CLI)
        run: npm install -g @bubblewrap/cli

      - name: Init and Build APK
        run: |
          bubblewrap init --manifest="https://earneasybdbot.github.io/Alapon-Lite/manifest.webmanifest"
          bubblewrap build

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v3
        with:
          name: Alapon-App-APK
          path: app-release-signed.apk
