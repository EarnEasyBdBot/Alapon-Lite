name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. Setup Java 21 (Required for latest Capacitor Android)
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      # 4. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 5. Prepare Web Dir & Initialize Capacitor
      - name: Initialize Android App
        run: |
          mkdir -p www
          cp -r index.html style.css app.js supabase.js manifest.webmanifest sw.js www/ || true
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Alapon Lite" "com.alapon.app" --web-dir "www"
          npx cap add android
          npx cap sync android

      # 6. Build Debug APK
      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      # 7. Upload APK Artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Alapon-Lite-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
