name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout repository with v4
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup Node.js with v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. Setup Java 17 with v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 4. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 5. Initialize Capacitor Android Project
      - name: Initialize Android App
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Alapon Lite" "com.alapon.app" --web-dir "."
          npx cap add android

      # 6. Build Debug APK
      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      # 7. Upload APK Artifact with v4
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Alapon-Lite-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
